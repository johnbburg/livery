# livery theme — high-contrast dark
#
# Every text colour here clears WCAG AA (4.5:1) against this background; fg,
# bold and ansi15 clear AAA (7:1). Lowest text colour is ansi1, which holds 7.5:1 even against the
# lightest background any project rule derives.
# `livery test <dir>` prints the measured ratio for each entry, so a modified
# copy can be checked rather than guessed at.
#
# ansi0 (black) and ansi8 (bright black) are structural — used for dim text and
# block-drawing, not body text — so the text threshold does not apply to them.

bg      #0b0f14
fg      #dfe6ee
cursor  #ffcc66
bold    #ffffff

ansi0   #20262e
ansi1   #ff9a9a
ansi2   #8fdf82
ansi3   #ffd479
ansi4   #79b8ff
ansi5   #e59bff
ansi6   #6fe0e0
ansi7   #c8d1db

ansi8   #5a6472
ansi9   #ff9aa2
ansi10  #b6f0a8
ansi11  #ffe6a8
ansi12  #a8d3ff
ansi13  #f0c2ff
ansi14  #a6f0f0
ansi15  #ffffff
