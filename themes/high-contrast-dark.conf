# livery theme — high-contrast dark
#
# An ANSI slot is used in two roles, and a colour readable in one can be
# unreadable in the other. A slot painted as text needs contrast against the
# background; the same slot painted *as* a background needs contrast against
# whatever text a program puts on it. `\e[37;41m` — Symfony Console's error
# block, so composer and drush — is ansi7 text on an ansi1 background, and a
# light ansi1 makes it illegible.
#
# So the two banks are tuned for different roles:
#
#   ansi1..ansi7   mid-tone, and safe in both roles. Programs address these
#                  both as text (`\e[31m`) and as backgrounds (`\e[41m`).
#   ansi9..ansi15  light, and tuned for text only. Backgrounds are addressed
#                  from this bank (`\e[101m`) too rarely to constrain it.
#
# Within the normal bank the target depends on which text convention pairs with
# each slot. Red, blue and magenta carry light text (`fg=white;bg=red`), so they
# are dark enough to hold ansi7 at 3:1. Green, yellow and cyan carry black text
# (`fg=black;bg=green`, `fg=black;bg=yellow`), so they stay light and hold ansi0
# at 9:1 or better.
#
# This bank split assumes `bold-is-bright` is on in the terminal profile, which
# is what sends `\e[1;31m` — bold red text, what grep, pytest and npm emit — to
# the bright bank. With it off, that text renders from ansi1 at 4.15:1 instead
# of 9.51:1 — readable, but without the punch the bright bank gives it.
#
# Measured as text against this background: fg, bold, cursor, the light
# normal-bank slots and the whole bright bank clear AAA (7:1), measuring 9.51:1
# at worst. The three dual-role slots sit at 4.05:1 to 4.15:1, just under AA.
# That is the trade the two roles force: at those hues no single value
# clears 4.5:1 as text and 3:1 under light text at once, and an unreadable
# error block is the worse of the two failures.
#
# ansi0 (black) and ansi8 (bright black) are structural — dim text and
# block-drawing, not body text — so the text threshold does not apply to them.
#
# `livery test <dir>` prints the measured ratio for each entry in both roles,
# so a modified copy can be checked rather than guessed at.

bg      #0b0f14
fg      #dfe6ee
cursor  #ffcc66
bold    #ffffff

ansi0   #20262e
ansi1   #eb0000
ansi2   #8fdf82
ansi3   #ffd479
ansi4   #006eeb
ansi5   #b900fa
ansi6   #6fe0e0
ansi7   #c8d1db

ansi8   #5a6472
ansi9   #ff9aa2
ansi10  #b6f0a8
ansi11  #ffe6a8
ansi12  #a8d3ff
ansi13  #f0c2ff
ansi14  #a6f0f0
ansi15  #ffffff
